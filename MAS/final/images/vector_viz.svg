<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="vecBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="200" fill="url(#vecBg)" rx="14"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#64748b" letter-spacing="3" font-weight="600">STEP 4 · LINEAR ALGEBRA · VECTOR ANALYSIS</text>

  <!-- ===== Left: Coordinate System ===== -->
  <!-- X axis -->
  <line x1="60" y1="160" x2="320" y2="160" stroke="#334155" stroke-width="1.5"/>
  <polygon points="320,156 330,160 320,164" fill="#475569"/>
  <text x="335" y="164" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">x</text>

  <!-- Y axis -->
  <line x1="60" y1="160" x2="60" y2="50" stroke="#334155" stroke-width="1.5"/>
  <polygon points="56,50 60,40 64,50" fill="#475569"/>
  <text x="48" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">y</text>

  <!-- Math Vector u: [48,50,46,54,36] avg ~46.8, scaled -->
  <!-- Representing as 2D: angle ~8.54 deg from science vector -->
  <!-- Math vector: longer, near x-axis -->
  <line x1="60" y1="160" x2="60" y2="160" stroke="#60a5fa" stroke-width="3" filter="url(#glow3)">
    <animate attributeName="x2" values="60;280" dur="1s" begin="0.5s" fill="freeze"/>
    <animate attributeName="y2" values="160;85" dur="1s" begin="0.5s" fill="freeze"/>
  </line>
  <polygon points="280,85 290,92 275,95" fill="#60a5fa" opacity="0" filter="url(#glow3)">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.5s" fill="freeze"/>
  </polygon>
  <text x="292" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#60a5fa" opacity="0" font-weight="700">
    u⃗ (Math)
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
  </text>

  <!-- Science vector: very close angle (8.54°), nearly same direction -->
  <line x1="60" y1="160" x2="60" y2="160" stroke="#34d399" stroke-width="3" filter="url(#glow3)">
    <animate attributeName="x2" values="60;268" dur="1s" begin="0.8s" fill="freeze"/>
    <animate attributeName="y2" values="160;72" dur="1s" begin="0.8s" fill="freeze"/>
  </line>
  <polygon points="268,72 278,80 263,82" fill="#34d399" opacity="0" filter="url(#glow3)">
    <animate attributeName="opacity" values="0;1" dur="0.1s" begin="1.8s" fill="freeze"/>
  </polygon>
  <text x="280" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#34d399" opacity="0" font-weight="700">
    v⃗ (Science)
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/>
  </text>

  <!-- Angle arc between the vectors -->
  <path d="M 90 160 Q 96 145, 102 148" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2s" fill="freeze"/>
  </path>
  <text x="105" y="145" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#fbbf24" font-weight="700" opacity="0">
    θ = 8.54°
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2s" fill="freeze"/>
  </text>

  <!-- Pulsing dot at origin -->
  <circle cx="60" cy="160" r="4" fill="#60a5fa">
    <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== Right: Metrics Cards ===== -->
  <!-- Card: Dot Product -->
  <rect x="380" y="48" width="155" height="58" rx="10" fill="#1e3a8a" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.0s" fill="freeze"/>
  </rect>
  <text x="457" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8" opacity="0">
    Dot Product (u⃗ · v⃗)
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.0s" fill="freeze"/>
  </text>
  <text x="457" y="95" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#60a5fa" font-weight="800" opacity="0">
    12,324
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.0s" fill="freeze"/>
  </text>

  <!-- Card: L1 Norm -->
  <rect x="545" y="48" width="155" height="58" rx="10" fill="#3b0764" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/>
  </rect>
  <text x="622" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8" opacity="0">
    L1 Norm ‖u⃗‖₁
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/>
  </text>
  <text x="622" y="95" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#a78bfa" font-weight="800" opacity="0">
    234.0
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/>
  </text>

  <!-- Card: L2 Norm -->
  <rect x="710" y="48" width="155" height="58" rx="10" fill="#022c22" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze"/>
  </rect>
  <text x="787" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8" opacity="0">
    L2 Norm ‖u⃗‖₂
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze"/>
  </text>
  <text x="787" y="95" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#34d399" font-weight="800" opacity="0">
    105.51
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze"/>
  </text>

  <!-- Large Angle Highlight Card -->
  <rect x="380" y="122" width="485" height="58" rx="10" fill="#1c1917" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.0s" fill="freeze"/>
  </rect>
  <!-- Animated left accent bar -->
  <rect x="380" y="122" width="5" height="58" rx="2" fill="#fbbf24" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.0s" fill="freeze"/>
  </rect>
  <text x="620" y="148" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#d1d5db" opacity="0">
    ✅ Vectors nearly parallel — Math &amp; Science performance is strongly aligned
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.0s" fill="freeze"/>
  </text>
  <text x="620" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#fbbf24" font-weight="700" opacity="0">
    Angle θ = 8.54° between u⃗ and v⃗
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.0s" fill="freeze"/>
  </text>

  <!-- Bottom glow bar -->
  <rect x="0" y="193" width="900" height="5" rx="0" fill="#065f46" opacity="0.5"/>
  <rect x="0" y="193" width="120" height="5" rx="0" fill="#34d399" opacity="0.8">
    <animate attributeName="x" values="-120;900" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
