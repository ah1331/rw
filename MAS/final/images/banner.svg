<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="50%" style="stop-color:#e0f2fe"/>
      <stop offset="100%" style="stop-color:#a5b4fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bgGrad)" rx="16"/>

  <!-- Animated grid lines -->
  <g opacity="0.08">
    <line x1="0" y1="55" x2="900" y2="55" stroke="#60a5fa" stroke-width="0.5"/>
    <line x1="0" y1="110" x2="900" y2="110" stroke="#60a5fa" stroke-width="0.5"/>
    <line x1="0" y1="165" x2="900" y2="165" stroke="#60a5fa" stroke-width="0.5"/>
    <line x1="180" y1="0" x2="180" y2="220" stroke="#60a5fa" stroke-width="0.5"/>
    <line x1="360" y1="0" x2="360" y2="220" stroke="#60a5fa" stroke-width="0.5"/>
    <line x1="540" y1="0" x2="540" y2="220" stroke="#60a5fa" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="220" stroke="#60a5fa" stroke-width="0.5"/>
  </g>

  <!-- Animated floating dots -->
  <circle cx="50" cy="50" r="2" fill="#60a5fa" opacity="0.6">
    <animate attributeName="cy" values="50;30;50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="170" r="1.5" fill="#a5b4fc" opacity="0.5">
    <animate attributeName="cy" values="170;150;170" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="60" r="2" fill="#7dd3fc" opacity="0.5">
    <animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="160" r="1.5" fill="#c4b5fd" opacity="0.4">
    <animate attributeName="cy" values="160;140;160" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="20" r="1.5" fill="#93c5fd" opacity="0.5">
    <animate attributeName="cy" values="20;35;20" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Decorative accent line left -->
  <rect x="28" y="60" width="4" height="100" fill="#3b82f6" rx="2">
    <animate attributeName="height" values="0;100;100" dur="1.2s" fill="freeze"/>
    <animate attributeName="y" values="110;60;60" dur="1.2s" fill="freeze"/>
  </rect>

  <!-- Main title -->
  <text x="450" y="85" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="1">
    Student Performance Analysis
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text x="450" y="118" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="2">
    DESCRIPTIVE STATISTICS  ·  PROBABILITY THEORY  ·  LINEAR ALGEBRA
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.5s" fill="freeze"/>
  </text>

  <!-- Divider line with animation -->
  <line x1="200" y1="135" x2="700" y2="135" stroke="#3b82f6" stroke-width="1" opacity="0.4">
    <animate attributeName="x1" values="450;200" dur="1s" begin="0.8s" fill="freeze"/>
    <animate attributeName="x2" values="450;700" dur="1s" begin="0.8s" fill="freeze"/>
  </line>

  <!-- Stat badges row -->
  <!-- Badge 1 -->
  <rect x="130" y="150" width="130" height="36" rx="18" fill="#1e40af" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="0.5s" begin="1.2s" fill="freeze"/>
  </rect>
  <text x="195" y="173" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#bfdbfe" opacity="0">
    📐 5,000 Students
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>
  </text>

  <!-- Badge 2 -->
  <rect x="280" y="150" width="130" height="36" rx="18" fill="#1e40af" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="0.5s" begin="1.4s" fill="freeze"/>
  </rect>
  <text x="345" y="173" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#bfdbfe" opacity="0">
    📊 4 Steps Analysis
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.4s" fill="freeze"/>
  </text>

  <!-- Badge 3 -->
  <rect x="430" y="150" width="130" height="36" rx="18" fill="#1e40af" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="0.5s" begin="1.6s" fill="freeze"/>
  </rect>
  <text x="495" y="173" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#bfdbfe" opacity="0">
    🎯 93.85% Pass Rate
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.6s" fill="freeze"/>
  </text>

  <!-- Badge 4 -->
  <rect x="580" y="150" width="130" height="36" rx="18" fill="#1e40af" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="0.5s" begin="1.8s" fill="freeze"/>
  </rect>
  <text x="645" y="173" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#bfdbfe" opacity="0">
    📐 8.54° Vector Angle
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.8s" fill="freeze"/>
  </text>

  <!-- Bottom glow bar -->
  <rect x="0" y="213" width="900" height="7" fill="#3b82f6" rx="0" opacity="0.5"/>
</svg>
