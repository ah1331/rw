<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180">
  <defs>
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1d4ed8"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#6d28d9"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0e7490"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="barSci1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#065f46"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>

  <rect width="900" height="180" fill="url(#statsBg)" rx="14"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#64748b" letter-spacing="3" font-weight="600">STEP 1 · DESCRIPTIVE STATISTICS RESULTS</text>

  <!-- LEFT: Math scores label -->
  <text x="220" y="52" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#93c5fd" font-weight="700">📐 Mathematics Scores</text>

  <!-- Math bars: Mean=64.40/100, Median=65/100, Mode=72/100 -->
  <!-- Mean bar -->
  <text x="52" y="78" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">Mean</text>
  <rect x="58" y="66" width="0" height="14" rx="7" fill="url(#bar1)">
    <animate attributeName="width" values="0;193" dur="1s" begin="0.3s" fill="freeze"/>
  </rect>
  <text x="260" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#60a5fa" opacity="0">
    64.40
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.3s" fill="freeze"/>
  </text>

  <!-- Median bar -->
  <text x="52" y="103" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">Median</text>
  <rect x="58" y="91" width="0" height="14" rx="7" fill="url(#bar2)">
    <animate attributeName="width" values="0;195" dur="1s" begin="0.5s" fill="freeze"/>
  </rect>
  <text x="262" y="103" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#a78bfa" opacity="0">
    65.00
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
  </text>

  <!-- Mode bar -->
  <text x="52" y="128" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">Mode</text>
  <rect x="58" y="116" width="0" height="14" rx="7" fill="url(#bar3)">
    <animate attributeName="width" values="0;216" dur="1s" begin="0.7s" fill="freeze"/>
  </rect>
  <text x="283" y="128" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#22d3ee" opacity="0">
    72.00
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.7s" fill="freeze"/>
  </text>

  <!-- Vertical divider -->
  <line x1="450" y1="40" x2="450" y2="160" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- RIGHT: Science scores -->
  <text x="675" y="52" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#34d399" font-weight="700">🔬 Science Scores</text>

  <!-- Range: 72/100 -->
  <text x="503" y="78" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">Range</text>
  <rect x="508" y="66" width="0" height="14" rx="7" fill="url(#barSci1)">
    <animate attributeName="width" values="0;216" dur="1s" begin="0.4s" fill="freeze"/>
  </rect>
  <text x="733" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#34d399" opacity="0">
    72.00
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/>
  </text>

  <!-- Variance: 192.07 scaled to /250 -->
  <text x="503" y="103" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">Variance</text>
  <rect x="508" y="91" width="0" height="14" rx="7" fill="url(#bar1)">
    <animate attributeName="width" values="0;230" dur="1s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="746" y="103" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#60a5fa" opacity="0">
    192.07
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.6s" fill="freeze"/>
  </text>

  <!-- Std Dev: 13.86 / 20 * 230 = ~160 -->
  <text x="503" y="128" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#94a3b8">Std Dev</text>
  <rect x="508" y="116" width="0" height="14" rx="7" fill="url(#bar2)">
    <animate attributeName="width" values="0;160" dur="1s" begin="0.8s" fill="freeze"/>
  </rect>
  <text x="676" y="128" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#a78bfa" opacity="0">
    13.86
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/>
  </text>

  <!-- Bottom pulse bar -->
  <rect x="0" y="173" width="900" height="5" rx="0" fill="#1d4ed8" opacity="0.5"/>
  <rect x="0" y="173" width="100" height="5" rx="0" fill="#60a5fa" opacity="0.8">
    <animate attributeName="x" values="-100;900" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
